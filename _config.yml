# Site metadata --------------------------------------------------------------

title: constitutions
# jekyll-seo-tag prefers `tagline` over `description` for the "<title> | …"
# suffix it builds when a page's title matches the site's — which is every time
# here, since the README's H1 is also "constitutions". Without it the tab shows
# the whole description.
tagline: rules for coding agents
description: >-
  Portable rule documents for coding agents — one per concern, copied into each project
  that needs them.
url: "https://polikeiji.github.io"
repository: polikeiji/constitutions

# Overridden on CI by `--baseurl "${{ steps.pages.outputs.base_path }}"`, which
# is what the deployed site actually uses. Kept here so a local `jekyll serve`
# produces the same URLs, and so PR builds (where configure-pages is allowed to
# fail) still get the right prefix.
baseurl: "/constitutions"

# No `theme:` on purpose. The layouts and stylesheet in this repo are the whole
# design; see _layouts/default.html for why.

# Plugins --------------------------------------------------------------------

plugins:
  # Render .md files that carry no YAML front matter. Whether constitutions get
  # front matter is still an open question in #4; this makes the site work
  # either way.
  - jekyll-optional-front-matter
  # Serve README.md at /, without renaming it or giving it front matter (which
  # would show up as raw YAML on github.com).
  - jekyll-readme-index
  # Rewrite [text](other-doc.md) to the built .html URL. Without it every
  # inter-document link 404s on the site while still working on github.com.
  - jekyll-relative-links
  # Page title from the first heading.
  - jekyll-titles-from-headings
  # <title>, description and Open Graph tags, fed by those derived titles.
  - jekyll-seo-tag

optional_front_matter:
  # Emit the rendered HTML only — don't also copy the raw .md into _site.
  remove_originals: true

readme_index:
  remove_originals: true

# jekyll-relative-links and jekyll-titles-from-headings run on their defaults:
# enabled, pages but not collections, and the first heading left in the body —
# the layout doesn't print page.title, so stripping it would drop the H1.

# Every page goes through _layouts/doc.html, the seam #10 (dark mode) and #11
# (Mermaid) extend. Nothing else assigns a layout: the pages here are markdown
# without front matter, so without this block they render as bare HTML
# fragments with no <head>, no stylesheet and no header.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: doc

# Content scope --------------------------------------------------------------

# Jekyll concats its own DEFAULT_EXCLUDES onto this list (Configuration
# #add_default_excludes) and discards dot-prefixed entries before consulting it
# (EntryFilter#special?), so Gemfile, Gemfile.lock, .jekyll-cache/ and .claude/ don't need
# naming here.
exclude:
  - CLAUDE.md        # instructions for the agent, not documentation
  - vendor/          # DEFAULT_EXCLUDES only covers vendor/bundle/ and friends
