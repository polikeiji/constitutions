name: pages

on:
  push:
    branches: [main]
  # Build (but don't deploy) on PRs, so a change to the site is verified before
  # it reaches main rather than after.
  pull_request:
    branches: [main]
  # Redeploy without a commit. Only deploys from main — see the deploy job.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For configure-pages' GET /repos/{owner}/{repo}/pages. Deliberately not
      # `write`, and no `id-token`: this job runs `bundle install` and five
      # third-party Jekyll plugins, and none of that needs to be able to
      # reconfigure Pages or mint an OIDC token.
      pages: read
    # Per-branch and disposable. Only the deploy path belongs in the single
    # shared queue below; sharing it here lets a PR build evict a main deploy
    # that is still pending.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        # A fork PR's token is granted no `pages` scope at all, so this 403s
        # there. Tolerate that on PRs, where the build falls back to the baseurl
        # in _config.yml; on main a failure here is real and should stop the run.
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$BASE_PATH" ]; then
            bundle exec jekyll build --baseurl "$BASE_PATH"
          else
            bundle exec jekyll build
          fi

      # Reads the exclude list out of _config.yml rather than restating it, so
      # a tree added there is covered here without anyone remembering to.
      - name: Check the build output
        run: |
          ruby -ryaml -e '
            leaked = YAML.load_file("_config.yml")["exclude"]
                         .select { |e| e.end_with?("/") && !e.start_with?(".") }
                         .select { |e| File.exist?(File.join("_site", e)) }
            abort("::error::excluded in _config.yml but present in _site: #{leaked.join(", ")}") if leaked.any?
            abort("::error::no _site/index.html - README was not used as the landing page") unless File.file?("_site/index.html")

            # The pages here carry no front matter, so their layout comes only
            # from the `defaults` block in _config.yml. Losing that block still
            # produces a plausible _site/index.html - just a bare fragment with
            # no <head>, stylesheet or header. Assert the layout actually ran.
            index = File.read("_site/index.html")
            abort("::error::_site/index.html has no <head> - the doc layout did not run, check `defaults` in _config.yml") unless index.include?("</head>")
          '

      # Nothing downloads this on a PR, where the deploy job is skipped.
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    # Not `github.event_name != 'pull_request'`: that would let a
    # workflow_dispatch run from any branch publish that branch to the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write # deploy-pages authenticates over OIDC; without this it fails
    # One deploy at a time, and never cancelled mid-flight: cancelling can leave
    # Pages wedged.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
