name: pages

on:
  push:
    branches: [main]
  # Build (but don't deploy) on PRs, so a change to the site is verified before
  # it reaches main rather than after.
  pull_request:
    branches: [main]
  # Redeploy without a commit. Only deploys from main — see the deploy job.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For configure-pages' GET /repos/{owner}/{repo}/pages. Deliberately not
      # `write`, and no `id-token`: this job runs `bundle install` and five
      # third-party Jekyll plugins, and none of that needs to be able to
      # reconfigure Pages or mint an OIDC token.
      pages: read
    # Per-branch and disposable. Only the deploy path belongs in the single
    # shared queue below; sharing it here lets a PR build evict a main deploy
    # that is still pending.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        # A fork PR's token is granted no `pages` scope at all, so this 403s
        # there. Tolerate that on PRs, where the build falls back to the baseurl
        # in _config.yml; on main a failure here is real and should stop the run.
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$BASE_PATH" ]; then
            bundle exec jekyll build --baseurl "$BASE_PATH"
          else
            bundle exec jekyll build
          fi

      # Reads the exclude list out of _config.yml rather than restating it, so
      # a tree added there is covered here without anyone remembering to.
      - name: Check the build output
        # The same fallback the build step above uses, so the baseurl asserted
        # is the one the pages were built with - including on a fork PR, where
        # configure-pages is allowed to fail and both fall back to _config.yml.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          ruby -ryaml -e '
            leaked = YAML.load_file("_config.yml")["exclude"]
                         .select { |e| e.end_with?("/") && !e.start_with?(".") }
                         .select { |e| File.exist?(File.join("_site", e)) }
            abort("::error::excluded in _config.yml but present in _site: #{leaked.join(", ")}") if leaked.any?
            abort("::error::no _site/index.html - README was not used as the landing page") unless File.file?("_site/index.html")

            # The pages here carry no front matter, so their layout comes only
            # from the `defaults` block in _config.yml. Losing that block still
            # produces a plausible _site/index.html - just a bare fragment with
            # no <head>, stylesheet or header. Assert the layout actually ran.
            index = File.read("_site/index.html")
            abort("::error::_site/index.html has no <head> - the doc layout did not run, check `defaults` in _config.yml") unless index.include?("</head>")

            # The sidebar is the one part of the layout assembled by hand
            # rather than by a plugin, and it fails quietly in three ways.
            # Losing the `defaults` block or regressing the layout drops it
            # from pages that still build and still read fine on their own. An
            # href that skipped relative_url builds clean here and 404s on the
            # deployed site, which is served under a baseurl. And the list is
            # derived from page titles, so a document that stops carrying one
            # falls out of the nav while every page still ships the box it used
            # to sit in. All three are asserted on every built page rather than
            # on the index alone, since a nav is only worth anything if it is
            # on all of them.

            # Chomped the way relative_url chomps it, so a baseurl written with
            # a trailing slash - which Jekyll treats as the same baseurl - does
            # not report every link on the site as broken.
            base = ENV["BASE_PATH"].to_s
            base = YAML.load_file("_config.yml")["baseurl"].to_s if base.empty?
            base = base.chomp("/")

            # assets/ is swept out rather than in: an HTML file vendored beside
            # mermaid.min.js is not a page and owes no nav.
            html = Dir.glob("_site/**/*.html").sort
                      .reject { |f| f.start_with?("_site/assets/") }
                      .to_h   { |f| [f, File.read(f)] }

            # Matched once, so a nav opened and never closed reads as a missing
            # nav here rather than raising NoMethodError further down.
            navs = html.transform_values { |body| body[/<nav class="site-nav".*?<\/nav>/m] }
            navless = navs.select { |_, nav| nav.nil? }.keys
            abort("::error::no sidebar in: #{navless.join(", ")} - check `defaults` in _config.yml and the nav in _layouts/default.html") if navless.any?

            # Where a nav href lands in the build, or nil if it lands nowhere.
            # Following each one in, rather than checking it starts with the
            # baseurl, because here those are not the same test: the documents
            # live under constitutions/ and the site deploys under
            # /constitutions/, so a raw page.url still carries the right prefix
            # and still 404s.
            target = lambda do |href|
              return nil unless href.start_with?("#{base}/")
              path = href[base.length..-1]
              path = File.join(path, "index.html") if path.end_with?("/")
              path = File.join("_site", path)
              File.file?(path) ? path : nil
            end

            links = navs.transform_values { |nav| nav.scan(/href="([^"]*)"/).flatten }

            broken = links.flat_map { |f, hrefs| hrefs.reject { |h| target.call(h) }.map { |h| "#{f}: #{h}" } }
            abort("::error::sidebar links that reach nothing in the build, and so 404 once deployed under #{base.inspect} - the usual cause is an href that skipped relative_url: #{broken.join("; ")}") if broken.any?

            # A page carrying the sidebar is a page the sidebar has to carry.
            # Without this the two checks above are satisfied by an empty nav,
            # which is what a change to how titles are derived - or a document
            # that stops opening with a heading - would actually produce.
            listed = links.values.flatten.map { |h| target.call(h) }.compact.uniq
            missing = html.keys - listed
            abort("::error::built pages the sidebar does not link to: #{missing.join(", ")} - the list is built from page titles, so check that each of these still opens with a heading") if missing.any?
          '

      # The two dark blocks in style.css cannot share one rule - a media query
      # and a plain selector do not combine - so the values are written twice.
      # Duplication drifts, and the bug it produces is quiet: the OS-dark page
      # and the explicitly-dark page slowly stop matching, and only a visitor
      # who uses the toggle ever sees it.
      - name: Check the two dark palettes match
        run: |
          ruby -e '
            css = File.read("assets/css/style.css")
            blocks = {
              "media-query" => css[/:root:not\(\[data-theme="light"\]\)\s*\{(.*?)\}/m, 1],
              "attribute"   => css[/:root\[data-theme="dark"\]\s*\{(.*?)\}/m, 1]
            }
            blocks.each do |name, body|
              abort("::error::no #{name} dark block found in assets/css/style.css - the palette layers moved, so update this check") if body.nil?
            end
            declarations = blocks.transform_values do |body|
              body.scan(/[-\w]+\s*:[^;]+/).map { |d| d.gsub(/\s+/, " ").strip }
            end
            unless declarations["media-query"] == declarations["attribute"]
              only = (declarations["media-query"] | declarations["attribute"]) -
                     (declarations["media-query"] & declarations["attribute"])
              abort("::error::the two dark palettes in assets/css/style.css have drifted: #{only.join("; ")}")
            end
          '

      # The Mermaid bundle is 3.5 MB, so _layouts/default.html ships it only to
      # pages whose rendered HTML contains a diagram. Both halves of that gate
      # fail quietly and in opposite directions - one sends 3.5 MB to every
      # page, the other stops sending it to the pages that need it - and the
      # site looks unchanged either way until someone opens a document with a
      # diagram in it. Assert both, and assert the bundle actually shipped:
      # `vendor/` in the exclude list above is rooted at the site source and
      # does not reach assets/js/vendor/, which is easy to misread.
      - name: Check the Mermaid gate
        run: |
          ruby -e '
            bundle  = "_site/assets/js/vendor/mermaid.min.js"
            fixture = "_site/constitutions/github-projects/board-to-pr.html"
            assets  = ["assets/js/vendor/mermaid.min.js", "assets/js/diagrams.js"]

            abort("::error::#{bundle} is not in the build - check that `vendor/` in _config.yml has not been widened to match it") unless File.file?(bundle)
            abort("::error::#{fixture} is missing - the Mermaid fixture page moved, so update this check") unless File.file?(fixture)

            html = File.read(fixture)
            # Rouge has no mermaid lexer, so kramdown emits its plain fallback
            # and puts the class on the <code>. If Rouge ever ships one the
            # class moves to a wrapper div; assets/js/diagrams.js handles both
            # shapes, and this substring is present in both.
            abort("::error::no language-mermaid block in #{fixture} - the fixture diagrams are gone") unless html.include?("language-mermaid")
            assets.each do |asset|
              abort("::error::#{fixture} has a diagram but does not load #{asset}") unless html.include?(asset)
            end

            plain = "_site/index.html"
            index = File.read(plain)
            abort("::error::#{plain} unexpectedly contains a diagram, so it cannot stand in for a diagram-free page here") if index.include?("language-mermaid")
            assets.each do |asset|
              abort("::error::#{plain} has no diagram but still loads #{asset}") if index.include?(asset)
            end
          '

      # Nothing downloads this on a PR, where the deploy job is skipped.
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    # Not `github.event_name != 'pull_request'`: that would let a
    # workflow_dispatch run from any branch publish that branch to the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write # deploy-pages authenticates over OIDC; without this it fails
    # One deploy at a time, and never cancelled mid-flight: cancelling can leave
    # Pages wedged.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
